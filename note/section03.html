<html lang="ko">

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/common.css" />

  </head>
  <body>
    <section class="section03">

          <p class="txt en">숲으로 떠나는 여름방학 STEP1</p>
        </div>
      </section>
      <section class="gallery">
        <div class="inner">
          <div class="textBox">
            <h2>Experience <span>program</span></h2>
            <p class="txt">체험 프로그램</p>
            <ul>
              <li><a href="#">program01</a></li>
              <li><a href="#">program02</a></li>
              <li><a href="#">program03</a></li>
              <li><a href="#">program04</a></li>

            </ul>
            <a href="#" class="btn">Read More</a>
          </div>
          <ul class="imgBox">
            <li class="img1 upBox">
              <img src="./images/section03/item02.jpg" alt="" />
            </li>
            <li class="img2 upBox">
              <img src="./images/section03/item02.jpg" alt="" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <script>
      gsap.registerPlugin(ScrollTrigger);

      let upBox = document.querySelectorAll(".upBox");

      let tl = gsap.timeline({
        scrollTrigger: {
          trigger: ".gallery",
          pin: true,
          scrub: 3,
          start: "top top",
          end: "+=400%", // 시작부분에서 400%까지 스크롤한 후 종료
          markers: true,
        },
      });

      tl.from(upBox, { y: "400%", duration: "8", ease: "none", stagger: "6" });
      tl.to(upBox, { y: "0" });
    </script>
  </body>
