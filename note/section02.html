    <script>
      window.addEventListener("DOMContentLoaded", function () {
        gsap.registerPlugin(ScrollTrigger);

        const listWrapper = document.querySelector(".portfolio .list");
        const listItems = gsap.utils.toArray(".portfolio .list li");

        const listA = gsap.utils.toArray(".portfolio .list .a");
        const listB = gsap.utils.toArray(".portfolio .list .b");
        const listC = gsap.utils.toArray(".portfolio .list .c");

        const itemWidth = listItems[0].offsetWidth;
        const itemGap = 30;
        const totalScrollWidth = (itemWidth + itemGap) * (listItems.length - 1);

        // 👉 끝에 요소까지 애니메이션 적용되도록 거리 여유 주기
        const scrollDistance = totalScrollWidth + window.innerWidth; // ← 핵심!

        gsap.to(listWrapper, {
          x: () => -totalScrollWidth,
          ease: "none",
          scrollTrigger: {
            trigger: ".portfolio",
            pin: true,
            scrub: 1,
            start: "top top",
            end: () => `+=${scrollDistance}`,
            markers: true, // 개발 중 디버깅용
          },
        });

        const scrollSettings = {
          trigger: ".portfolio",
          scrub: 2,
          end: () => `+=${scrollDistance}`,
        };

        gsap.to(listA, {
          y: 50,
          rotation: 10,
          scrollTrigger: scrollSettings,
        });

        gsap.to(listB, {
          y: -50,
          rotation: 20,
          scrollTrigger: scrollSettings,
        });

        gsap.to(listC, {
          y: -50,
          x: 20,
          rotation: -10,
          scrollTrigger: scrollSettings,
        });
      });
    </script>
